<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boussole V0</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1b2430;background:#f3f4ef}*{box-sizing:border-box}body{margin:0}.shell{max-width:1180px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px}.brand{font-weight:800;letter-spacing:.08em;font-size:24px}.brand span{font-weight:600;color:#6a736d;font-size:14px}header p{margin:7px 0 0;color:#5c655f}.actions{display:flex;gap:8px}button{border:1px solid #ccd1ca;background:#fff;border-radius:10px;padding:10px 13px;cursor:pointer}.primary{background:#24392f;color:white;border-color:#24392f;font-weight:700}.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,.8fr);gap:18px}.chat,aside section{background:#fff;border:1px solid #dde0da;border-radius:16px;box-shadow:0 5px 18px rgba(27,36,48,.05)}.chat{min-height:70vh;display:flex;flex-direction:column}.messages{padding:22px;flex:1;overflow:auto;max-height:62vh}.messages article{max-width:82%;padding:12px 15px;border-radius:14px;margin:0 0 12px}.assistant{background:#eef1eb}.user{background:#24392f;color:#fff;margin-left:auto!important}article p{margin:0;white-space:pre-wrap;line-height:1.48}form{border-top:1px solid #e3e5df;padding:16px}textarea{width:100%;resize:vertical;border:1px solid #ccd1ca;border-radius:11px;padding:12px;font:inherit}.sendrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:9px}#status{color:#747c77;font-size:13px}aside{display:flex;flex-direction:column;gap:14px}aside section{padding:17px}.eyebrow{font-size:11px;letter-spacing:.11em;color:#78817b;font-weight:800}.phase{font-size:25px;font-weight:800;margin:5px 0 14px}.mapitem{border-top:1px solid #eceee9;padding:10px 0}.mapitem b{font-size:12px}.mapitem div{margin-top:4px;line-height:1.35}.muted{color:#777f79}.hidden{display:none!important}pre{white-space:pre-wrap;font-size:11px;background:#f6f7f4;padding:10px;border-radius:9px;overflow:auto}@media(max-width:800px){.shell{padding:14px}.layout{grid-template-columns:1fr}header{display:block}.actions{margin-top:12px}.messages{max-height:none;min-height:48vh}.messages article{max-width:93%}}
</style>
</head>
<body>
<main class="shell">
<header>
<div><div class="brand">BOUSSOLE <span>V0.3</span></div><p>Comprendre ce qui bloque. Aller chercher la suite au bon endroit.</p></div>
<div class="actions"><button id="diagBtn">Diagnostic</button><button id="newBtn">Nouvelle situation</button></div>
</header>
<div class="layout">
<section class="chat">
<div id="messages" class="messages"><article class="assistant"><p>Qu’est-ce qui t’amène ? Raconte-moi simplement ce qui se passe, même si c’est confus.</p></article></div>
<form id="form"><textarea id="input" rows="3" placeholder="Écris comme tu parlerais…" required></textarea><div class="sendrow"><span id="status"></span><button class="primary" type="submit">Envoyer</button></div></form>
</section>
<aside>
<section><div class="eyebrow">CARTE ACTUELLE</div><div id="phase" class="phase">Brouillard</div><div id="map"><p class="muted">Elle se construira à partir de ce qui est réellement établi.</p></div></section>
<section id="experimentBox" class="hidden"><div class="eyebrow">DANS LE RÉEL</div><div id="experiment"></div></section>
<section id="diagnosticBox" class="hidden"><div class="eyebrow">DIAGNOSTIC TEST</div><pre id="diagnostic"></pre></section>
</aside>
</div>
</main>
<script>
const $=s=>document.querySelector(s);let sessionId=null,lastDiag=null,currentState=null,localMessages=[];
const fields=[["situation","Situation"],["facts","Faits"],["observations","Observations"],["interpretations","Interprétations"],["hypotheses","Hypothèses"],["tensions","Tensions"],["unknowns","Ce qui reste à éclaircir"],["learnings","Apprentissages"],["directions","Directions"],["next_action","Prochaine action"]];
function saveCache(){localStorage.setItem('boussole_cache',JSON.stringify({state:currentState,messages:localMessages.slice(-24)}))}
function readCache(){try{return JSON.parse(localStorage.getItem('boussole_cache')||'null')}catch{return null}}
async function createSession(resume=null){const r=await fetch('/api/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({resume:resume||undefined})});const s=await r.json();sessionId=s.id;currentState=s.state;localMessages=s.messages||resume?.messages||[];localStorage.setItem('boussole_session',sessionId);saveCache();renderState(s.state);return s}
async function load(){const cache=readCache();sessionId=localStorage.getItem('boussole_session');let s=null;if(sessionId){const r=await fetch('/api/session/'+sessionId);if(r.ok)s=await r.json()}if(!s)s=await createSession(cache);currentState=s.state;localMessages=s.messages||cache?.messages||[];$('#messages').innerHTML='';if(!localMessages.length)add('assistant','Qu’est-ce qui t’amène ? Raconte-moi simplement ce qui se passe, même si c’est confus.');localMessages.forEach(m=>{add(m.role,m.text);if(m.diagnostic)lastDiag=m.diagnostic});renderState(currentState);renderDiag();saveCache()}
function add(role,text){const a=document.createElement('article');a.className=role==='user'?'user':'assistant';const p=document.createElement('p');p.textContent=text;a.append(p);$('#messages').append(a);a.scrollIntoView({behavior:'smooth',block:'end'})}
function renderState(s){currentState=s;saveCache();$('#phase').textContent=({brouillard:'Brouillard',clarte:'Clarté',experience:'Expérience',apprentissage:'Apprentissage',direction:'Direction'})[s.phase]||s.phase;const m=$('#map');m.innerHTML='';for(const [k,label] of fields){let v=s[k];if(Array.isArray(v))v=v.join(' · ');if(v){const d=document.createElement('div');d.className='mapitem';const b=document.createElement('b');b.textContent=label;const p=document.createElement('div');p.textContent=v;d.append(b,p);m.append(d)}}if(!m.children.length)m.innerHTML='<p class="muted">Elle se construira à partir de ce qui est réellement établi.</p>';const box=$('#experimentBox');if(s.pending_experiment){box.classList.remove('hidden');$('#experiment').textContent=s.pending_experiment}else box.classList.add('hidden')}
function renderDiag(){if(lastDiag)$('#diagnostic').textContent=JSON.stringify(lastDiag,null,2)}
$('#form').addEventListener('submit',async e=>{e.preventDefault();const input=$('#input'),text=input.value.trim();if(!text)return;add('user',text);localMessages.push({role:'user',text});saveCache();input.value='';input.disabled=true;$('#status').textContent='Boussole cherche l’intervention la plus utile…';try{const payload={message:text,resume:{state:currentState,messages:localMessages.slice(0,-1)}};let r=await fetch(`/api/session/${sessionId}/message`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});let d=await r.json();if(r.status===404){const restored=await createSession(readCache());r=await fetch(`/api/session/${restored.id}/message`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});d=await r.json()}if(!r.ok)throw new Error(d.error||'Erreur');add('assistant',d.message);localMessages.push({role:'assistant',text:d.message,diagnostic:d.diagnostic});lastDiag=d.diagnostic;renderDiag();renderState(d.state);saveCache()}catch(err){add('assistant','Je n’ai pas pu répondre : '+err.message)}finally{input.disabled=false;input.focus();$('#status').textContent=''}});
$('#diagBtn').onclick=()=>{$('#diagnosticBox').classList.toggle('hidden');renderDiag()};
$('#newBtn').onclick=async()=>{if(sessionId)await fetch('/api/session/'+sessionId,{method:'DELETE'});localStorage.removeItem('boussole_session');localStorage.removeItem('boussole_cache');currentState=null;localMessages=[];$('#messages').innerHTML='';add('assistant','Qu’est-ce qui t’amène ? Raconte-moi simplement ce qui se passe, même si c’est confus.');lastDiag=null;await createSession()};
load();
</script>
</body>
</html>
